name: Build Doom Headless Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make libpng-dev

      - name: Clone doomgeneric
        run: git clone --depth 1 https://github.com/ozkl/doomgeneric.git

      - name: Use interactive headless platform
        run: |
          # Copy the interactive version (with key injection) from the repo
          cp doomgeneric_headless.c doomgeneric/doomgeneric_headless.c
          echo "Using interactive headless platform with key injection"

      - name: Build static binary
        run: |
          cd doomgeneric
          # Use the exact source list from doomgeneric/Makefile (excludes platform files)
          SRC="doomgeneric/dummy.c doomgeneric/am_map.c doomgeneric/doomdef.c doomgeneric/doomstat.c doomgeneric/dstrings.c doomgeneric/d_event.c doomgeneric/d_items.c doomgeneric/d_iwad.c doomgeneric/d_loop.c doomgeneric/d_main.c doomgeneric/d_mode.c doomgeneric/d_net.c doomgeneric/f_finale.c doomgeneric/f_wipe.c doomgeneric/g_game.c doomgeneric/hu_lib.c doomgeneric/hu_stuff.c doomgeneric/info.c doomgeneric/i_cdmus.c doomgeneric/i_endoom.c doomgeneric/i_joystick.c doomgeneric/i_scale.c doomgeneric/i_sound.c doomgeneric/i_system.c doomgeneric/i_timer.c doomgeneric/memio.c doomgeneric/m_argv.c doomgeneric/m_bbox.c doomgeneric/m_cheat.c doomgeneric/m_config.c doomgeneric/m_controls.c doomgeneric/m_fixed.c doomgeneric/m_menu.c doomgeneric/m_misc.c doomgeneric/m_random.c doomgeneric/p_ceilng.c doomgeneric/p_doors.c doomgeneric/p_enemy.c doomgeneric/p_floor.c doomgeneric/p_inter.c doomgeneric/p_lights.c doomgeneric/p_map.c doomgeneric/p_maputl.c doomgeneric/p_mobj.c doomgeneric/p_plats.c doomgeneric/p_pspr.c doomgeneric/p_saveg.c doomgeneric/p_setup.c doomgeneric/p_sight.c doomgeneric/p_spec.c doomgeneric/p_switch.c doomgeneric/p_telept.c doomgeneric/p_tick.c doomgeneric/p_user.c doomgeneric/r_bsp.c doomgeneric/r_data.c doomgeneric/r_draw.c doomgeneric/r_main.c doomgeneric/r_plane.c doomgeneric/r_segs.c doomgeneric/r_sky.c doomgeneric/r_things.c doomgeneric/sha1.c doomgeneric/sounds.c doomgeneric/statdump.c doomgeneric/st_lib.c doomgeneric/st_stuff.c doomgeneric/s_sound.c doomgeneric/tables.c doomgeneric/v_video.c doomgeneric/wi_stuff.c doomgeneric/w_checksum.c doomgeneric/w_file.c doomgeneric/w_main.c doomgeneric/w_wad.c doomgeneric/z_zone.c doomgeneric/w_file_stdc.c doomgeneric/i_input.c doomgeneric/i_video.c doomgeneric/doomgeneric.c"
          gcc -O2 -static -Wall -Wno-unused-result -Wno-unused-variable \
              -DNORMALUNIX -DLINUX -D_DEFAULT_SOURCE -DGENERIC -Idoomgeneric \
              $SRC doomgeneric_headless.c \
              -o doomgeneric_headless -lpng -lz -lm
          file doomgeneric_headless
          ldd doomgeneric_headless 2>&1 || true
          ls -lh doomgeneric_headless
          sha256sum doomgeneric_headless

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomgeneric_headless_linux_x86_64
          path: doomgeneric/doomgeneric_headless
